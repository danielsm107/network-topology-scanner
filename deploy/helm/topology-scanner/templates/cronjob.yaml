apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "topology-scanner.fullname" . }}-escaneo
  labels:
    {{- include "topology-scanner.labels" . | nindent 4 }}
    app.kubernetes.io/component: escaneo
spec:
  schedule: {{ .Values.escaneo.schedule | quote }}
  timeZone: {{ .Values.escaneo.timeZone }}
  # Si uno se alarga, el siguiente no arranca encima
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Sin reintentos: un escaneo fallido se ve en el clúster, no se repite a ciegas
      backoffLimit: 0
      activeDeadlineSeconds: {{ .Values.escaneo.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "topology-scanner.labels" . | nindent 12 }}
            app.kubernetes.io/component: escaneo
        spec:
          restartPolicy: Never
          {{- include "topology-scanner.podComun" . | nindent 10 }}
          volumes:
            {{- include "topology-scanner.volumenDatos" . | nindent 12 }}
            {{- if .Values.aws.enabled }}
            # Los archivos de esta noche, del escaneo a la subida
            - name: salida
              emptyDir: {}
            - name: script
              configMap:
                name: {{ include "topology-scanner.fullname" . }}-subida
            # HOME de aws-cli: el resto del sistema de archivos es de solo lectura
            - name: tmp
              emptyDir: {}
            {{- end }}
          {{- if .Values.aws.enabled }}
          # Primero el escaneo; la subida solo arranca si ha terminado bien
          initContainers:
            {{- include "topology-scanner.contenedorEscaneo" . | nindent 12 }}
          containers:
            - name: subida
              image: {{ .Values.aws.imagen }}
              imagePullPolicy: IfNotPresent
              command: [sh, /script/subir.sh]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              env:
                - name: TZ
                  value: {{ .Values.zonaHoraria | quote }}
                - name: HOME
                  value: /tmp
                - name: AWS_REGION
                  value: {{ .Values.aws.region | quote }}
                - name: BUCKET
                  value: {{ required "aws.bucket es obligatorio con aws.enabled" .Values.aws.bucket | quote }}
                - name: TOPIC_ARN
                  value: {{ required "aws.topicArn es obligatorio con aws.enabled" .Values.aws.topicArn | quote }}
                - name: DIAS_ENLACES
                  value: {{ .Values.aws.diasEnlaces | quote }}
                {{- range list "AWS_ACCESS_KEY_ID" "AWS_SECRET_ACCESS_KEY" }}
                # Del Secret creado a mano con la clave del usuario IAM del homelab
                - name: {{ . }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ $.Values.aws.secret }}
                      key: {{ . }}
                {{- end }}
              volumeMounts:
                - name: salida
                  mountPath: /salida
                  readOnly: true
                - name: script
                  mountPath: /script
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                {{- toYaml .Values.resources.subida | nindent 16 }}
          {{- else }}
          containers:
            {{- include "topology-scanner.contenedorEscaneo" . | nindent 12 }}
          {{- end }}
