# Valores por defecto, con datos inventados. Los reales van en
# deploy/helm/values.local.yaml (ignorado por git); ver values.example.yaml.

image:
  repository: ghcr.io/danielsm107/topology-scanner
  # Tag fijo, nunca latest: el clúster tiene que correr una versión conocida
  tag: "1.3.0"
  pullPolicy: IfNotPresent

escaneo:
  # Cada noche a las 3:00 hora de Madrid (sin timeZone, k3s usaría UTC)
  schedule: "0 3 * * *"
  timeZone: Europe/Madrid
  # Rangos a escanear (IP o CIDR, uno por elemento)
  rangos:
    - 192.0.2.0/24
  # Detección de SO (-O): bastante más lento, pero de noche no hay prisa
  osDetection: true
  # IPs de los routers/switches a consultar por SNMP; vacío = sin SNMP (estrella)
  snmp: []
  # Límite de duración del Job. Ajustarlo con lo que tarde el primer escaneo real
  activeDeadlineSeconds: 14400

# Hora local de los pods (variable TZ), en formato POSIX: así funciona sin
# el paquete tzdata. Sin ella, el historial guardaría la hora en UTC y el
# nocturno de las 3:00 saldría en la lista como 02:00. Este es Europe/Madrid.
zonaHoraria: "CET-1CEST,M3.5.0,M10.5.0/3"

# Redes que la web puede escanear (TOPOLOGY_ALLOWED_RANGES). Vacío = las de
# escaneo.rangos: en el clúster la web nunca queda sin límite.
rangosPermitidos: []

web:
  # Puerto del nodo (hostNetwork): NPM hace de proxy a <IP del nodo>:<puerto>
  puerto: 8501

# Secret con TOPOLOGY_SNMP_USER / _AUTH_KEY / _PRIV_KEY. Se crea a mano, nunca
# desde el chart (ver docs/devops/runbooks/03-kubernetes.md)
snmpSecret: topology-scanner-snmp

persistencia:
  storageClass: local-path
  tamano: 1Gi

resources:
  escaneo:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  web:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
