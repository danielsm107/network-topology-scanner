# Valores por defecto, con datos inventados. Los reales van en
# deploy/helm/values.local.yaml (ignorado por git); ver values.example.yaml.

image:
  repository: ghcr.io/danielsm107/topology-scanner
  # Tag fijo, nunca latest: el clúster tiene que correr una versión conocida
  tag: "1.6.0"
  pullPolicy: IfNotPresent

escaneo:
  # Cada noche a las 3:00 hora de Madrid (sin timeZone, k3s usaría UTC)
  schedule: "0 3 * * *"
  timeZone: Europe/Madrid
  # Rangos a escanear (IP o CIDR, uno por elemento)
  rangos:
    - 192.0.2.0/24
  # Detección de SO (-O): bastante más lento, pero de noche no hay prisa
  osDetection: true
  # IPs de los routers/switches a consultar por SNMP; vacío = sin SNMP (estrella)
  snmp: []
  # Límite de duración del Job. Ajustarlo con lo que tarde el primer escaneo real
  activeDeadlineSeconds: 14400

# Hora local de los pods (variable TZ), en formato POSIX: así funciona sin
# el paquete tzdata. Sin ella, el historial guardaría la hora en UTC y el
# nocturno de las 3:00 saldría en la lista como 02:00. Este es Europe/Madrid.
zonaHoraria: "CET-1CEST,M3.5.0,M10.5.0/3"

# Redes que la web puede escanear (TOPOLOGY_ALLOWED_RANGES). Vacío = las de
# escaneo.rangos: en el clúster la web nunca queda sin límite.
rangosPermitidos: []

web:
  # Puerto del nodo (hostNetwork): NPM hace de proxy a <IP del nodo>:<puerto>
  puerto: 8501
  # Nombre con el que NPM la publica por HTTPS (p. ej. topology.example.com).
  # Vacío = sin proxy. Puesto, Streamlit no consulta su IP pública
  # (checkip.amazonaws.com) para anunciarse ni para validar el websocket
  dominio: ""

# Secret con TOPOLOGY_SNMP_USER / _AUTH_KEY / _PRIV_KEY. Se crea a mano, nunca
# desde el chart (ver docs/devops/runbooks/03-kubernetes.md)
snmpSecret: topology-scanner-snmp

# Prueba del despliegue (`helm test`). Vacío = comprueba image.tag. Solo lo
# cambia el ensayo de fallo del pipeline de Jenkins (runbook 05-jenkins.md)
pruebas:
  versionEsperada: ""

# Fase 4: el nocturno sube a S3 los informes (HTML, CSV y cambios) y la copia
# del historial, y si hubo cambios avisa por SNS (email) con enlaces temporales.
# Bucket y topic salen de los outputs de infra/aws/hallazgos.
aws:
  enabled: false
  region: eu-south-2
  bucket: ""
  topicArn: ""
  # Secret con AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY del usuario IAM del
  # homelab. Se crea a mano, nunca desde el chart (runbook 04-aws.md)
  secret: topology-scanner-aws
  # Imagen oficial fijada por digest (una tag se puede mover). Una versión con
  # unos días publicada, no la recién salida
  imagen: amazon/aws-cli:2.39.3@sha256:d557b3524475d70dd3104cf44d96568ee3188897b73a6ece2b37aa50e1af362f
  # Validez de los enlaces del email; 7 es el máximo con claves de usuario IAM
  diasEnlaces: 7

# Fase 6: el nocturno escribe sus métricas (--metrics-file) y un contenedor
# las sube al Pushgateway de la monitorización (deploy/monitoring/). Si el
# Pushgateway no está, el Job no falla: lo avisa la alerta ScanMetricsStale.
metricas:
  enabled: false
  # El pod usa ClusterFirstWithHostNet: resuelve los Services del clúster
  pushgateway: http://prometheus-pushgateway.monitoring.svc:9091
  # Imagen oficial de curl, fijada por digest
  imagen: curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93

persistencia:
  storageClass: local-path
  tamano: 1Gi

resources:
  escaneo:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  web:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  subida:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
  metricas:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {cpu: 100m, memory: 64Mi}
