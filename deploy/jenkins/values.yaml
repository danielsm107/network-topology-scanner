# Valores del chart oficial de Jenkins (jenkins/jenkins, versión en el runbook
# 05-jenkins.md y en ci.yml). Los datos reales (dominio) van en values.local.yaml,
# ignorado por git; ver values.example.yaml.

controller:
  image:
    tag: "2.580.2-jdk25@sha256:415ab90d4e3b25148f7191bc04f455a20817d6c4c3b0a98f6c6b0da4877f7081"
    pullPolicy: IfNotPresent
  # Sin ejecutores: el controlador no corre pipelines, los corren pods efímeros
  numExecutors: 0
  # Secret creado a mano (runbook 05): la contraseña no pasa por los values
  admin:
    createSecret: false
    existingSecret: jenkins-admin
  resources:
    requests: {cpu: 200m, memory: 1Gi}
    limits: {cpu: "2", memory: 2Gi}
  javaOpts: "-XX:MaxRAMPercentage=60"
  # NPM hace de proxy a <IP del nodo>:30880, con HTTPS y solo desde la LAN
  serviceType: NodePort
  nodePort: 30880
  testEnabled: false
  # Lista COMPLETA, dependencias incluidas: con installLatestPlugins: false, una dependencia
  # que falte se instala en su versión mínima, y así dejó de cargar Pipeline: Declarative
  # (pipeline { } terminaba en verde sin ejecutar nada). Cómo regenerarla: runbook 05-jenkins.md
  installPlugins:
    - antisamy-markup-formatter:173.v680e3a_b_69ff3
    - apache-httpcomponents-client-4-api:4.5.14-269.vfa_2321039a_83
    - asm-api:9.11.1-226.vff833a_e4c58e
    - authentication-tokens:1.144.v5ff4a_5ec5c33
    - bootstrap5-api:5.3.8-1048.va_c299057e35c
    - bouncycastle-api:2.30.1.86.2-310.v4655f6742752
    - branch-api:2.1303.v9f3b_95dc329d
    - caffeine-api:3.3.1-214.v18eb_56b_34920
    - cloudbees-folder:6.1107.v31f8955765c8
    - commons-lang3-api:3.21.0-122.v6a_ea_4fd34049
    - commons-text-api:1.15.0-218.va_61573470393
    - configuration-as-code:2147.v8a_8d38668c72
    - credentials-binding:728.v902a_273b_8947
    - credentials:1514.vb_01eb_014e7d4
    - display-url-api:2.217.va_6b_de84cc74b_
    - durable-task:686.v80ff80875b_82
    - font-awesome-api:7.3.1-1013.v0835a_879ec6d
    - git-client:6.6.1
    - git:5.11.0
    - gson-api:2.15.0-212.v085f60a_8093b_
    - instance-identity:203.v15e81a_1b_7a_38
    - ionicons-api:94.vcc3065403257
    - jackson-annotations2-api:2.23-28.v3db_d0f5f2387
    - jackson2-api:2.22.4-449.v4ee9f4ec4123
    - jakarta-activation-api:2.1.4-1
    - jakarta-mail-api:2.1.5-1
    - jakarta-xml-bind-api:4.0.9-19.v2b_a_5b_44d9a_1c
    - javax-activation-api:1.2.0-8
    - jaxb:2.3.9-143.v5979df3304e6
    - job-dsl:3732.v9a_c49a_61a_313
    - joda-time-api:2.15.1-211.ve499f52b_da_33
    - json-api:20260814-226.v20f9685d642c
    - kubernetes-client-api:7.3.1-256.v788a_0b_787114
    - kubernetes-credentials:207.v492f58828b_ed
    - kubernetes:4560.vc25b_83890c34
    - mailer:534.v1b_36f5864073
    - metrics:4.2.37-494.v06f9a_939d33a_
    - mina-sshd-api-common:2.20.1-199.v8ce76b_c93542
    - mina-sshd-api-core:2.20.1-199.v8ce76b_c93542
    - okhttp-api:5.5.0-242.v1482d48d3ea_3
    - pipeline-build-step:601.v6d4c6d1a_9dc7
    - pipeline-groovy-lib:822.vc95f70dea_db_7
    - pipeline-input-step:560.v56198a_642157
    - pipeline-milestone-step:152.v6e22b_8cfc66c
    - pipeline-model-api:2.2293.v6e7193cec599
    - pipeline-model-definition:2.2293.v6e7193cec599
    - pipeline-model-extensions:2.2293.v6e7193cec599
    - pipeline-stage-step:345.va_96187909426
    - pipeline-stage-tags-metadata:2.2293.v6e7193cec599
    - plain-credentials:199.v9f8e1f741799
    - plugin-util-api:7.1403.vd380b_c42e90c
    - prism-api:1.30.0-741.v034eb_0b_0a_a_fa_
    - scm-api:728.vc30dcf7a_0df5
    - script-security:1436.v1082791135e4
    - snakeyaml-api:2.7-152.vc672728cf536
    - ssh-credentials:372.va_250881b_08cd
    - structs:362.va_b_695ef4fdf9
    - variant:70.va_d9f17f859e0
    - woodstox-core-api:7.3.0-16.v017f30ed004c
    - workflow-aggregator:608.v67378e9d3db_1
    - workflow-api:1429.v7a_1b_efb_a_f7c5
    - workflow-basic-steps:1129.v60e3c7e6654d
    - workflow-cps:4403.v471713a_cea_19
    - workflow-durable-task-step:1479.v56e587f413a_7
    - workflow-job:1624.ve973eb_34e031
    - workflow-multibranch:842.v3a_b_59b_57b_e6e
    - workflow-scm-step:487.v41313a_96b_65d
    - workflow-step-api:724.v538c2362b_dfb_
    - workflow-support:1028.vc22910142650
  installLatestPlugins: false
  # Que el volumen no conserve otras versiones de una instalación anterior
  overwritePlugins: true
  # Sin el sidecar de recarga: una imagen menos. Un cambio de JCasC se aplica al reiniciar
  sidecars:
    configAutoReload:
      enabled: false
  JCasC:
    securityRealm: |-
      local:
        allowsSignup: false
        enableCaptcha: false
        users:
          - id: "${chart-admin-username}"
            name: "Jenkins Admin"
            password: "${chart-admin-password}"
    authorizationStrategy: |-
      loggedInUsersCanDoAnything:
        allowAnonymousRead: false
    configScripts:
      jobs: |
        jobs:
          - script: |
              pipelineJob('desplegar') {
                description('Despliega el escáner: prueba, marcha atrás y aviso. Runbook 05-jenkins.md')
                logRotator { numToKeep(100) }
                parameters {
                  choiceParam('MODO', ['manual', 'automatico'], 'automatico solo lo usa el job sondear')
                  stringParam('VERSION', '', 'X.Y.Z. Vacío: vuelve a desplegar la actual con los values del Secret')
                  choiceParam('ENSAYO', ['ninguno', 'no-arranca', 'falla-prueba'], 'Ensayo de fallo; solo en manual')
                }
                properties { disableConcurrentBuilds() }
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote { url('https://github.com/danielsm107/network-topology-scanner.git') }
                        branch('*/main')
                      }
                    }
                    scriptPath('Jenkinsfile')
                    lightweight(true)
                  }
                }
              }
              pipelineJob('sondear') {
                description('Cada 5 minutos: si hay una versión nueva, lanza desplegar')
                logRotator { numToKeep(20) }
                properties {
                  disableConcurrentBuilds()
                  pipelineTriggers { triggers { cron { spec('H/5 * * * *') } } }
                }
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote { url('https://github.com/danielsm107/network-topology-scanner.git') }
                        branch('*/main')
                      }
                    }
                    scriptPath('deploy/jenkins/sondear.Jenkinsfile')
                    lightweight(true)
                  }
                }
              }

agent:
  # Por digest; los pipelines lo heredan con inheritFrom 'default'
  image:
    tag: "3395.v6e5377b_0fb_3c-4-jdk25@sha256:b800dc3ef1e95eb74918f61d7323b31bff7fd2c8d7e692f8f56578e7541d84ea"
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}

# La crea deploy/jenkins/rbac.yaml
serviceAccountAgent:
  create: false
  name: jenkins-agente

persistence:
  storageClass: local-path
  size: 8Gi
