[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "topology-scanner"
version = "1.3.0"
description = "Network topology scanner (nmap + SNMP) with device classification and an interactive HTML map"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "danielsm107" }]
keywords = ["nmap", "snmp", "lldp", "network", "topology", "scanner", "inventory"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "python-nmap>=0.7.1",
    "networkx>=3.0",
    "pyvis>=0.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]
web = [
    # >=1.56 por st.iframe, que dibuja el panel de topología (sustituye a
    # st.components.v1.html, obsoleto). También cubre st.fragment(run_every=...)
    # (1.37), con el que _fragmento_progreso() refresca el estado del escaneo.
    "streamlit>=1.56",
]
snmp = [
    # >=7.1: API asyncio con nombres snake_case (walk_cmd,
    # UdpTransportTarget.create) que usa snmp.py. Exige Python >=3.10.
    "pysnmp>=7.1",
    # pysnmp la usa para cifrar en SNMPv3 (AES/DES) pero no la declara como
    # dependencia; >=43 por cryptography.hazmat.decrepit, que es lo que importa.
    "cryptography>=43",
]

[project.urls]
Homepage = "https://github.com/danielsm107/network-topology-scanner"
Issues = "https://github.com/danielsm107/network-topology-scanner/issues"
Changelog = "https://github.com/danielsm107/network-topology-scanner/blob/main/CHANGELOG.md"

[project.scripts]
topology-scanner = "topology_scanner.cli:main"
topology-scanner-web = "topology_scanner.webapp:lanzar"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
# El código ya usa líneas más largas que las 88 por defecto (diccionarios de
# datos, f-strings en español) sin que aporte legibilidad partirlas todas.
line-length = 120

[tool.ruff.lint]
# Sin esto, ruff sin [tool.ruff.lint] activa ~800 reglas (prácticamente
# "ALL", incluidas categorías irrelevantes aquí como async/trio o
# compatibilidad py2/3) - demasiado ruido para CI. Selección explícita:
# pyflakes + pycodestyle, imports (I, ya usado para ordenar), pyupgrade,
# bugbear, simplify y las reglas propias de ruff.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
