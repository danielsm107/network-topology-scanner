name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml la reutiliza: una sola definición de "estar en verde"
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.10 es el mínimo declarado en pyproject.toml (requires-python);
        # 3.12 es la última estable. No hace falta más granularidad.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instala el paquete y las dependencias de dev/web/snmp
        run: pip install -e ".[dev,web,snmp]"

      - name: ruff check
        run: ruff check src/ tests/ scripts/

      # tests/test_helm.py renderiza el chart: sin Helm se saltaría en silencio
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v4.3.1

      - name: pytest
        run: pytest tests/ -v

  # La infraestructura como código: formato, validez y los terraform test. Sin
  # backend ni credenciales (init -backend=false; los tests usan el provider
  # simulado): el plan/apply de verdad se lanza a mano desde el PC.
  # tests/test_workflows.py comprueba que cada raíz de infra/ tiene su validate.
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          # La misma que en el PC: el formato de fmt cambia entre versiones
          terraform_version: 1.16.6

      - name: terraform fmt
        run: terraform fmt -check -recursive infra/

      - name: Bootstrap (bucket del estado)
        run: |
          terraform -chdir=infra/aws/bootstrap init -backend=false -input=false
          terraform -chdir=infra/aws/bootstrap validate

      - name: VM de Proxmox
        run: |
          terraform -chdir=infra/proxmox init -backend=false -input=false
          terraform -chdir=infra/proxmox validate
          terraform -chdir=infra/proxmox test

  # El chart de Helm del despliegue en k3s: lint y que renderice con los
  # values de ejemplo. Lo que tiene que cumplir cada pod lo comprueba
  # tests/test_helm.py (job test). El helm install lo lanza el mantenedor.
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          # La misma que en el PC
          version: v4.3.1

      - name: helm lint
        run: helm lint deploy/helm/topology-scanner -f deploy/helm/topology-scanner/values.example.yaml --strict

      - name: helm template
        run: helm template ci deploy/helm/topology-scanner -f deploy/helm/topology-scanner/values.example.yaml

  # La imagen Docker: se construye, se prueba por fuera (como la usaría
  # alguien) y se escanea. Publicarla es cosa de release.yml.
  #
  # Actions de terceros y la imagen de Trivy fijadas por SHA/digest, no por
  # tag: en marzo de 2026 robaron credenciales de Aqua y reescribieron 76 de
  # las 77 tags de aquasecurity/trivy-action (y las de setup-trivy) para que
  # robaran los secretos de cada pipeline que las usaba. Una tag se puede
  # mover; un SHA no. Por eso Trivy va como imagen oficial por digest, sin
  # su action (que además lo instala a través de setup-trivy, otra capa).
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Construye la imagen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          tags: topology-scanner:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Corre como el usuario sin privilegios (UID 10001)
        run: test "$(docker run --rm --entrypoint id topology-scanner:ci -u)" = "10001"

      # Con --cap-drop ALL, como el drop: [ALL] de Kubernetes: comprueba que
      # nmap no pide ninguna capacidad más que estas dos
      - name: nmap arranca solo con NET_RAW y NET_ADMIN
        run: >
          docker run --rm --cap-drop ALL --cap-add NET_RAW --cap-add NET_ADMIN
          --entrypoint nmap topology-scanner:ci --version

      # Lo que le pasa a quien copia el docker run sin --cap-add: tiene que
      # fallar diciendo cómo arreglarlo (scanner.error_de_nmap)
      - name: Sin capacidades falla con un mensaje que dice qué hacer
        run: |
          if salida=$(docker run --rm topology-scanner:ci 127.0.0.1 2>&1); then
            echo "::error::Sin --cap-add el escaneo debería fallar"; exit 1
          fi
          echo "$salida"
          echo "$salida" | grep -q -- "--cap-add NET_RAW --cap-add NET_ADMIN"

      - name: La web (extra [web]) está instalada
        run: docker run --rm --entrypoint python topology-scanner:ci -c "import topology_scanner.webapp"

      # Falla con vulnerabilidades críticas que ya tengan arreglo (las que no
      # lo tienen no se pueden resolver actualizando: solo meterían ruido).
      # Digest = aquasec/trivy:0.75.0
      - name: Trivy
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          image --severity CRITICAL --ignore-unfixed --exit-code 1 topology-scanner:ci
