name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 es el mínimo declarado en pyproject.toml (requires-python);
        # 3.12 es la última estable. No hace falta más granularidad.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instala el paquete y las dependencias de dev/web
        run: pip install -e ".[dev,web]"

      - name: ruff check
        run: ruff check src/ tests/

      - name: pytest
        run: pytest tests/ -v
