name: Release

# Un tag vX.Y.Z publica esa versión en PyPI y crea la release de GitHub.
# A mano (workflow_dispatch) solo publica en TestPyPI: sirve para probar el
# pipeline sin gastar una versión en el PyPI real (una versión publicada no
# se puede volver a subir, ni borrándola).
#
# Sin tokens: PyPI confía en este workflow por OIDC ("trusted publishing"),
# configurado en pypi.org/test.pypi.org para este repo, este archivo y el
# environment de cada job.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # pyproject.toml manda: un tag que no coincide es un error, no una
      # versión que se corrige sola
      - name: El tag coincide con la versión de pyproject.toml
        if: github.event_name == 'push'
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::El tag $GITHUB_REF_NAME no coincide con la versión de pyproject.toml ($version)"
            exit 1
          fi

      # Aquí y no al crear la release: si falla después de publicar en PyPI,
      # la versión ya no tiene vuelta atrás. Notas = la sección de esta
      # versión en CHANGELOG.md (de su "## [X.Y.Z]" hasta el siguiente "## [")
      - name: Extrae las notas de la versión del CHANGELOG
        if: github.event_name == 'push'
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir notas
          awk -v v="$version" '/^## \[/ { dentro = index($0, "[" v "]") > 0; next } dentro' CHANGELOG.md > notas/notas.md
          if [ ! -s notas/notas.md ]; then
            echo "::error::CHANGELOG.md no tiene sección para $version"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: notas
          path: notas/

      - name: Construye sdist y wheel
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/topology-scanner
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # Relanzar la prueba con la misma versión no debe fallar
          skip-existing: true

  pypi:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/topology-scanner
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  # La imagen Docker de la misma versión, en GHCR (pública: se descarga sin
  # credenciales). needs: build reutiliza la comprobación tag = versión.
  # amd64 y arm64 (Raspberry Pi en homelabs), esta última emulada con QEMU.
  # Actions de Docker fijadas por SHA, por el mismo motivo que en ci.yml.
  imagen:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Tags X.Y.Z y latest; etiquetas OCI (source enlaza el paquete con el repo)
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/danielsm107/topology-scanner
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.description=Network topology scanner (nmap + SNMP) with an interactive map and web UI

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Después de PyPI y de la imagen: la release solo aparece con las dos publicadas
  github-release:
    needs: [pypi, imagen]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@v8
        with:
          name: notas
          path: notas/

      - name: Crea la release con las notas del CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notas/notas.md
